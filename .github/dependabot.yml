# Weekly version updates. npm minor and patch releases share one PR;
# major releases are ignored because Hardhat 3, hardhat-toolbox 5+ and
# OpenZeppelin 6 need code changes. GitHub Actions share one PR.
# The cooldown holds back releases younger than 14 days; security updates
# are not delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /Task_2_2_Solidity_Lending
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Bangkok
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
